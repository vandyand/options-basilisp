[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stevetrading-basilisp"
version = "0.1.0"
description = "Ground-up Basilisp rewrite of StevenTrading."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "basilisp==0.5.1",
  "balli @ git+https://github.com/vandyand/balli.git@5757dce09528ad1e90e7d9e493860c8a033b6b21",
  "databento==0.81.0",
  "numpy>=1.26",
  "websockets>=13,<16",
  "pytest>=8.0",
  "python-ulid>=2.7",
  "tzdata>=2025.2",
]

[project.scripts]
steve = "stevetrading_cli:main"

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
  "fast: cheap deterministic tests suitable for the normal edit loop",
  "ops: operational script, deployment, status, or workflow tests",
  "integration: cross-component tests or tests that exercise CLI/process boundaries",
  "slow: tests intentionally too expensive for the normal edit loop",
  "market: tests that require or validate market-hours/runtime data assumptions",
  "remote: tests that require a remote host or external service",
]
pythonpath = [
  "tests",
  ".",
  "components/domain.identifiers/src",
  "components/domain.enums/src",
  "components/domain.instruments/src",
  "components/domain.schemas/src",
  "components/domain.validation/src",
  "components/engine.state/src",
  "components/engine.fold/src",
  "components/engine.machines/src",
  "components/engine.recovery/src",
  "components/engine.commands/src",
  "components/engine.loop/src",
  "components/strategy.registry/src",
  "components/feature.core/src",
  "components/inference.core/src",
  "components/signal.core/src",
  "components/risk.core/src",
  "components/execution.core/src",
  "components/ledger.core/src",
  "components/portfolio.core/src",
  "components/broker.protocol/src",
  "components/market-data.protocol/src",
  "components/persistence.protocol/src",
  "components/observability.protocol/src",
  "components/control-plane.protocol/src",
  "components/artifact.protocol/src",
  "components/broker.alpaca/src",
  "components/broker.fanout/src",
  "components/broker.router/src",
  "components/broker.sim/src",
  "components/market-data.alpaca/src",
  "components/market-data.databento/src",
  "components/market-data.thetadata/src",
  "components/market-data.thetadata-schema/src",
  "components/market-data.composite/src",
  "components/market-data.replay/src",
  "components/persistence.fact-store/src",
  "components/persistence.snapshot-store/src",
  "components/observability.structured-log/src",
  "components/control-plane.file-store/src",
  "components/artifact.file-store/src",
  "components/analysis.core/src",
  "components/analysis.derived-greeks/src",
  "components/current-pnl.core/src",
  "components/reporting.core/src",
  "components/report-metrics.core/src",
  "components/status.core/src",
  "components/ops.core/src",
  "components/feature-parity.core/src",
  "components/replay.fixture/src",
  "components/bridge.steve-v2/src",
  "components/bridge.v2-term/src",
  "components/bridge.v2-vol/src",
  "bases/engine-live/src",
  "bases/engine-replay/src",
  "bases/control-plane/src",
  "bases/reports/src",
  "bases/dev/src",
]
testpaths = [
  "tests",
]

[tool.setuptools]
include-package-data = true
py-modules = ["stevetrading_cli"]
